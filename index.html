<style>
:root{--g:#166534;--g2:#22863a;--bg:#f3f7f4;--c:#fff;--t:#14231a;--m:#5f6f65;--b:#d9e4dc;--r:#b42318;--bar:#bfe0c9;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--g:#4ade80;--g2:#2f9e55;--bg:#0f1712;--c:#17231b;--t:#e8f1ea;--m:#9db0a2;--b:#2a3b2f;--r:#f87171;--bar:#25513a;color-scheme:dark}}
:root[data-theme="dark"]{--g:#4ade80;--g2:#2f9e55;--bg:#0f1712;--c:#17231b;--t:#e8f1ea;--m:#9db0a2;--b:#2a3b2f;--r:#f87171;--bar:#25513a;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:var(--g2);color:#fff;padding:14px 16px;font-weight:700;font-size:18px}
main{max-width:820px;margin:0 auto;padding:12px 12px 96px}
h2{margin:6px 2px 10px;font-size:20px}small,.mut{color:var(--m)}
.card{background:var(--c);border:1px solid var(--b);border-radius:14px;padding:12px;margin:0 0 10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
@media(min-width:640px){.grid{grid-template-columns:repeat(3,1fr)}}
.stat{background:var(--c);border:1px solid var(--b);border-radius:14px;padding:12px}.stat small{display:block}.stat b{font-size:19px}
.stat.hi{background:var(--g2);border-color:var(--g2);color:#fff}.stat.hi small{color:#e3f5e8}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--c);border-top:1px solid var(--b);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav button{flex:1;border:0;background:none;color:var(--m);padding:8px 2px;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
nav button span{font-size:20px}nav button.on{color:var(--g);font-weight:700}
button{font:inherit;cursor:pointer}
.big{width:100%;border:0;background:var(--g2);color:#fff;font-weight:700;font-size:18px;padding:16px;border-radius:14px;margin:4px 0}
.ghost{width:100%;border:1px solid var(--b);background:var(--c);color:var(--t);padding:12px;border-radius:12px;margin:4px 0}
.sm{border:1px solid var(--b);background:var(--c);color:var(--t);padding:8px 12px;border-radius:10px}
.sm.p{background:var(--g2);color:#fff;border-color:var(--g2)}.sm.d{color:var(--r)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.chip{border:1px solid var(--b);background:var(--c);color:var(--t);border-radius:12px;padding:10px 12px;text-align:left;min-width:46%;flex:1}
.chip small{display:block}
label{display:block;font-size:13px;color:var(--m);margin:6px 0}
input,select,textarea{width:100%;font:inherit;padding:11px;border:1px solid var(--b);border-radius:10px;background:var(--bg);color:var(--t);margin-top:3px}
.row{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;background:var(--c);border:1px solid var(--b);border-radius:14px;padding:10px;margin-bottom:8px;align-items:end}
.row>b{grid-column:1/3}.x{border:0;background:none;color:var(--r);font-size:20px}.lt{grid-column:1/4;text-align:right;font-weight:700;color:var(--g)}
.sum{display:flex;justify-content:space-between;padding:4px 0}.sum.big2{font-size:20px;color:var(--g)}
.ch{display:flex;align-items:flex-end;gap:3px;height:150px;margin-top:8px}
.ch div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;cursor:pointer}
.ch i{display:block;width:100%;background:var(--g2);border-radius:4px 4px 0 0;min-height:2px}.ch span{font-size:10px;color:var(--m);height:14px}
.seg{display:flex;gap:6px;margin-bottom:8px}.seg button{flex:1;padding:8px;border:1px solid var(--b);background:var(--c);color:var(--t);border-radius:10px}.seg button.on{background:var(--g2);color:#fff;border-color:var(--g2)}
.up{color:var(--g)}.dn{color:var(--r)}
.oh{display:flex;justify-content:space-between;cursor:pointer}.cx{opacity:.6}.cx em{color:var(--r);font-style:normal}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:6px 4px;border-bottom:1px solid var(--b);text-align:left}td:last-child,th:last-child{text-align:right}
.modal{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;z-index:9;padding:16px}.modal[hidden]{display:none}
.mb{background:var(--c);border-radius:16px;padding:16px;width:100%;max-width:480px}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:12px;z-index:10;display:none}
.ok{text-align:center;padding:28px 12px}.ok b{font-size:28px;color:var(--g);display:block;margin:8px 0}
.chip{transition:background .25s,border-color .25s,color .25s,transform .1s}.chip.sel{background:var(--g2);border-color:var(--g);color:#fff}.chip.sel small{color:#e3f5e8}button{transition:transform .1s}button:active{transform:scale(.97)}.pi{width:100%;height:70px;object-fit:cover;border-radius:8px;margin-bottom:4px;display:block}nav{overflow-x:auto}nav button{min-width:66px}

:root{--bg:#f4f6f3;--c:#fff;--t:#17261c;--m:#667569;--b:#e2e8e3;--g:#166534;--g2:#15803d;--bar:#d3ead9}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1511;--c:#16211a;--t:#e9f2ec;--m:#9bb0a1;--b:#263629;--g:#4ade80;--g2:#1f8f4a;--bar:#22402d}}
header{background:var(--c);color:var(--t);border-bottom:1px solid var(--b);font-size:19px;padding:14px 16px}
main{padding:14px 14px 160px}h2{font-size:22px}
.card,.stat{border-radius:18px;border:1px solid var(--b);box-shadow:0 1px 2px #0000000a}
.stat b{font-size:20px}.stat.hi{grid-column:1/-1}.stat.hi b{font-size:30px}
.big{min-height:56px;border-radius:16px}input,select{min-height:48px;border-radius:12px}
.chips{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:700px){.chips{grid-template-columns:repeat(4,1fr)}}
.chip{position:relative;min-width:0;width:100%;flex:none;padding:8px 8px 12px;text-align:center;border-radius:18px;border:2px solid var(--b);display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:600;font-size:17px}
.chip small{font-weight:500;font-size:15px;color:var(--g)}
.chip .pi{width:100%;height:auto;aspect-ratio:1/1;object-fit:cover;border-radius:12px;margin:0 0 6px;display:block;background:var(--bar)}
.chip .ph{display:flex;align-items:center;justify-content:center;color:var(--g);font-size:40px;font-weight:700}
.chip svg{width:30px;height:30px;fill:none;stroke:var(--g);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;margin:6px 0}
.chip.sel{background:var(--g2);border-color:var(--g2);color:#fff}.chip.sel small{color:#fff}
.chip.sel::after{content:'✓';position:absolute;top:12px;right:12px;width:28px;height:28px;border-radius:50%;background:#fff;color:var(--g2);font-weight:800;display:flex;align-items:center;justify-content:center}
.th{float:right;width:64px;height:64px;object-fit:cover;border-radius:12px;margin-left:10px}
nav{padding-top:6px;box-shadow:0 -4px 16px #0000000d}
nav button{font-size:12px;gap:3px;padding:6px 2px;min-width:0}nav button span{font-size:12px}
nav button svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--g)}nav button.on svg{stroke-width:2.6}
#bar{position:fixed;left:12px;right:12px;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:4;background:var(--g2);color:#fff;border-radius:16px;padding:10px 12px 10px 16px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 6px 20px #0003;line-height:1.2}
#bar[hidden]{display:none}#bar button{background:#fff;color:var(--g);border:0;border-radius:12px;padding:13px 20px;font-weight:700;font-size:16px}
summary{font-weight:600;cursor:pointer;padding:4px 0}
</style></head><body>
<header id="hd">Giò chả</header>
<main id="v"></main>
<div id="bar" hidden></div><nav id="nv"></nav>
<div id="au" class="modal" style="align-items:flex-start;overflow:auto;background:var(--bg)"><div class="mb" id="ab" style="margin-top:8vh"></div></div>
<div id="m" class="modal" hidden></div><div id="toast"></div>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script>
const $=s=>document.querySelector(s),V=7*36e5;let K='giocha_v1';
let S=null;try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
if(!S||!S.orders)S={products:[],orders:[],units:['kg','cây','đòn','hộp','phần'],shop:'Cơ sở giò chả',seq:0,pseq:0};
const DEF={showCust:1,showDisc:1,showNote:1,showImg:1,showProfit:1};
function norm(){['customers','suppliers','imports'].forEach(c=>S[c]=S[c]||[]);S.cfg=Object.assign({},DEF,S.cfg)}norm();
let DB=null,ADM=true,CA={},SYN='Đang kết nối…',busy=0,again=0;
const COLS=['products','orders','customers','suppliers','imports'],W=c=>ADM||c=='orders'||c=='customers';
const sj=o=>JSON.stringify(o,(k,v)=>v&&typeof v=='object'&&!Array.isArray(v)?Object.keys(v).sort().reduce((a,b)=>(a[b]=v[b],a),{}):v);
const sy=m=>{SYN=m;const e=$('#sy');if(e)e.textContent=m};
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}push()};
async function push(){if(!DB)return;if(busy){again=1;return}busy=1;try{sy('Đang đồng bộ…');
for(const c of COLS){if(!W(c))continue;for(const x of S[c]){const j=sj(x),k=c+'/'+x.id;if(CA[k]!==j){await DB.doc(k).set(x);CA[k]=j}}}
for(const k of Object.keys(CA)){if(k=='cfg')continue;const[c,id]=k.split('/');if(W(c)&&!S[c].some(x=>x.id==id)){await DB.doc(k).delete();delete CA[k]}}
if(ADM){const cf={shop:S.shop,units:S.units,cfg:S.cfg},j=sj(cf);if(CA.cfg!==j){await DB.doc('settings/main').set(cf);CA.cfg=j}}
sy('Đã đồng bộ ✓')}catch(e){if(e&&e.code=='invalid_argument')sy('Không có quyền ghi');else{sy('Mất mạng/lỗi — tự thử lại');setTimeout(push,6000)}}busy=0;if(again){again=0;push()}}
function refresh(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}const a=document.activeElement;if(!a||!/INPUT|TEXTAREA|SELECT/.test(a.tagName))R()}
let SB=null,PROF=null,entered=0,REC=0,lt=0;
const TBL='records',chk=r=>{if(r.error)throw{code:(r.error.code=='42501'||r.status==403)?'invalid_argument':'net',message:r.error.message}};
function mkDB(){return{doc:p=>{const i=p.indexOf('/'),st=p.slice(0,i),id=p.slice(i+1);return{
set:async x=>chk(await SB.from(TBL).upsert({shop_id:PROF.shop_id,store:st,id,data:x},{onConflict:'shop_id,store,id'})),
delete:async()=>chk(await SB.from(TBL).delete().eq('shop_id',PROF.shop_id).eq('store',st).eq('id',id))}}}}
function apply(c,rem){const dirty=W(c)?S[c].filter(x=>CA[c+'/'+x.id]!==sj(x)):[];rem.forEach(x=>{if(!dirty.some(d=>d.id==x.id))CA[c+'/'+x.id]=sj(x)});
Object.keys(CA).filter(k=>k.startsWith(c+'/')&&!rem.some(x=>c+'/'+x.id==k)).forEach(k=>delete CA[k]);S[c]=[...rem.filter(x=>!dirty.some(d=>d.id==x.id)),...dirty]}
async function loadAll(){if(!SB||!PROF)return;let rows=[],from=0;try{for(;;){const r=await SB.from(TBL).select('store,id,data').eq('shop_id',PROF.shop_id).order('store').order('id').range(from,from+999);if(r.error)throw r.error;rows=rows.concat(r.data);if(r.data.length<1000)break;from+=1000}}catch(e){return sy('Mất mạng — đang dùng dữ liệu trên máy')}
COLS.forEach(c=>apply(c,rows.filter(x=>x.store==c).map(x=>x.data)));
const st=rows.find(x=>x.store=='settings'&&x.id=='main');if(st){const d=st.data;S.shop=d.shop||S.shop;S.units=d.units||S.units;S.cfg=Object.assign({},DEF,d.cfg);CA.cfg=sj({shop:S.shop,units:S.units,cfg:S.cfg})}
hd();refresh();if(!busy)sy('Đã đồng bộ ✓')}
const sub=()=>{SB.channel('rec').on('postgres_changes',{event:'*',schema:'public',table:TBL},()=>{clearTimeout(lt);lt=setTimeout(loadAll,400)}).subscribe();setInterval(loadAll,60000);addEventListener('online',()=>{loadAll();push()});document.addEventListener('visibilitychange',()=>{if(!document.hidden)loadAll()})};
function loadLocal(){S=null;try{S=JSON.parse(localStorage.getItem(K))}catch(e){}if(!S||!S.orders)S={products:[],orders:[],units:['kg','cây','đòn','hộp','phần'],shop:(PROF&&PROF.sname)||'Cơ sở giò chả',seq:0,pseq:0};norm();CA={}}
async function enter(se){try{let P=null;try{const r=await SB.from('profiles').select('id,email,role,shop_id').eq('id',se.user.id).single();P=r.data}catch(e){}
if(!P){try{P=JSON.parse(localStorage.getItem('giocha_prof')||'null')}catch(e){}if(!P||P.id!=se.user.id){entered=0;return ashow('login','Không tải được tài khoản. Kiểm tra mạng.')}}
PROF=P;if(!P.shop_id)return ashow('setup');
try{const sh=await SB.from('shops').select('name').eq('id',P.shop_id).single();if(sh.data)P.sname=sh.data.name}catch(e){}
localStorage.setItem('giocha_prof',JSON.stringify(P));ADM=P.role=='admin';K='giocha_'+P.shop_id;loadLocal();DB=mkDB();$('#au').hidden=true;hd();R();sy('Đang tải…');await loadAll();sub();push()}catch(e){entered=0;ashow('login','Lỗi: '+(e.message||e))}}
function ashow(m,msg){$('#au').hidden=false;const f=(l,id,t,ac)=>`<label>${l}<input id="${id}" type="${t||'text'}" autocomplete="${ac||'off'}"></label>`;
const M={login:`<h2>🌿 Đăng nhập</h2>${f('Email','a_e','email','username')}${f('Mật khẩu','a_p','password','current-password')}<button class="big" onclick="doLogin()">Đăng nhập</button><button class="ghost" onclick="ashow('reg')">Tạo tài khoản mới</button><button class="ghost" onclick="ashow('forgot')">Quên mật khẩu</button>`,
reg:`<h2>Tạo tài khoản</h2>${f('Email','a_e','email','username')}${f('Mật khẩu (từ 8 ký tự)','a_p','password','new-password')}<button class="big" onclick="doReg()">Đăng ký</button><button class="ghost" onclick="ashow('login')">Đã có tài khoản</button>`,
forgot:`<h2>Quên mật khẩu</h2>${f('Email đã đăng ký','a_e','email','username')}<button class="big" onclick="doForgot()">Gửi email đặt lại mật khẩu</button><button class="ghost" onclick="ashow('login')">Quay lại</button>`,
reset:`<h2>Đặt mật khẩu mới</h2>${f('Mật khẩu mới (từ 8 ký tự)','a_p','password','new-password')}<button class="big" onclick="doReset()">Lưu mật khẩu</button>`,
setup:`<h2>Chọn cơ sở</h2><b>Bạn là chủ cơ sở?</b>${f('Tên cơ sở','a_n')}<button class="big" onclick="mkShop()">Tạo cơ sở mới (làm quản trị viên)</button><hr><b>Bạn là nhân viên?</b>${f('Mã mời do quản trị viên cung cấp','a_c')}<button class="ghost" onclick="joinShop()">Tham gia cơ sở</button><button class="ghost" onclick="SB.auth.signOut()">Đăng xuất</button>`,
cfg:`<h2>Chưa cấu hình</h2><p>Mở tệp <b>config.js</b>, điền Project URL và anon key của Supabase (xem HUONG-DAN.md), rồi tải lại trang.</p>`};
$('#ab').innerHTML=M[m]+`<p id="am" class="mut">${esc(msg||'')}</p>`}
const amsg=t=>{$('#am').textContent=t},em=()=>$('#a_e').value.trim(),pw=()=>$('#a_p').value;
async function doLogin(){const r=await SB.auth.signInWithPassword({email:em(),password:pw()});if(r.error)amsg(/confirm/i.test(r.error.message)?'Hãy bấm liên kết xác nhận trong email trước.':'Sai email hoặc mật khẩu')}
async function doReg(){if(pw().length<8)return amsg('Mật khẩu cần ít nhất 8 ký tự');const r=await SB.auth.signUp({email:em(),password:pw(),options:{emailRedirectTo:location.origin+location.pathname}});if(r.error)return amsg(r.error.message);if(!r.data.session)amsg('Đã gửi email xác nhận. Mở email, bấm liên kết, rồi quay lại đăng nhập.')}
async function doForgot(){const r=await SB.auth.resetPasswordForEmail(em(),{redirectTo:location.origin+location.pathname});amsg(r.error?r.error.message:'Đã gửi email. Mở email và bấm liên kết để đặt mật khẩu mới.')}
async function doReset(){if(pw().length<8)return amsg('Mật khẩu cần ít nhất 8 ký tự');const r=await SB.auth.updateUser({password:pw()});if(r.error)return amsg(r.error.message);location.href=location.pathname}
async function mkShop(){const n=$('#a_n').value.trim();if(!n)return amsg('Nhập tên cơ sở');const r=await SB.rpc('create_shop',{p_name:n});if(r.error)return amsg(r.error.message);location.reload()}
async function joinShop(){const c=$('#a_c').value.trim();if(!c)return amsg('Nhập mã mời');const r=await SB.rpc('join_shop',{p_code:c});if(r.error)return amsg(r.error.message);location.reload()}
function logout(){ask('Đăng xuất khỏi thiết bị này?',async()=>{await SB.auth.signOut();location.reload()})}
async function mem(){if(!ADM||!$('#mem'))return;const[a,b]=await Promise.all([SB.from('shops').select('invite_code').single(),SB.from('profiles').select('id,email,role').eq('shop_id',PROF.shop_id)]);if(!$('#mem'))return;
$('#mem').innerHTML=`<b>Nhân viên</b><p>Mã mời: <b>${esc(a.data?a.data.invite_code:'')}</b> <button class="sm" onclick="regen()">Đổi mã</button><br><small>Nhân viên đăng ký tài khoản, chọn "Tham gia cơ sở" và nhập mã này.</small></p>`+(b.data||[]).map(m=>`<div class="sum"><span>${esc(m.email)}</span><span><select onchange="setRole('${m.id}',this.value)" ${m.id==PROF.id?'disabled':''} style="width:auto"><option value="admin" ${m.role=='admin'?'selected':''}>Quản trị</option><option value="staff" ${m.role=='staff'?'selected':''}>Nhân viên</option></select>${m.id==PROF.id?'':` <button class="sm d" onclick="rmMember('${m.id}')">Xóa</button>`}</span></div>`).join('')}
async function setRole(id,r){const x=await SB.rpc('set_member_role',{p_user:id,p_role:r});toast(x.error?x.error.message:'Đã cập nhật quyền');mem()}
function rmMember(id){ask('Xóa nhân viên này khỏi cơ sở?',async()=>{const x=await SB.rpc('remove_member',{p_user:id});toast(x.error?x.error.message:'Đã xóa');mem()})}
async function regen(){const x=await SB.rpc('regen_invite');toast(x.error?x.error.message:'Đã đổi mã mời');mem()}
const rz=f=>new Promise((ok,no)=>{const i=new Image();i.onload=()=>{const k=Math.min(1,800/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);c.toBlob(b=>b?ok(b):no(),'image/jpeg',.8)};i.onerror=no;i.src=URL.createObjectURL(f)});
async function up(el){const f=el.files[0];if(!f)return;if(!ADM)return toast('Chỉ quản trị viên được tải ảnh');try{const path=PROF.shop_id+'/'+uid()+'.jpg',r=await SB.storage.from('product-images').upload(path,await rz(f),{contentType:'image/jpeg'});if(r.error)throw r.error;PF.img=SB.storage.from('product-images').getPublicUrl(path).data.publicUrl;$('#pimw').innerHTML=`<img src="${esc(PF.img)}" class="pi" style="width:64px;height:64px">`}catch(e){toast('Tải ảnh lỗi')}}
