/* ===== v20.14.2: trả hàng ngay trên dòng sản phẩm (lấy 1 kg, trả 0,5 kg => thực mua 0,5 kg) ===== */
function cItems(o){const g=[],mp={};o.items.forEach(i=>{const k=i.pid+'|'+i.price+'|'+(i.cost||0);let x=mp[k];if(!x){const {qty,...r}=i;x=mp[k]={...r,man:1,price:String(i.price),t:0,r:0};g.push(x)}if(i.qty<0)x.r+=-i.qty;else x.t+=i.qty});
return g.map(x=>{const {t,r,...y}=x,f=v=>String(Math.round(v*1000)/1000).replace('.',',');return {...y,qty:f(t),rq:r>0?f(r):'',rop:r>0?1:0}})}
function rqsT(i){const q=pq(i.qty)||0,r=pq(i.rq)||0,p=pp(i.price)||0;if(!(r>0))return 'Nhập số lượng khách trả lại';if(r>q&&q>0)return `<span style="color:var(--r)">Số trả lớn hơn số đã lấy (${num(q)} ${esc(i.unit)})</span>`;return `Đã lấy ${num(q)} − trả ${num(r)} = <b>thực mua ${num(Math.round((q-r)*1000)/1000)} ${esc(i.unit)}</b> · ${money(Math.round(q*p)-Math.round(r*p))}`}
function rqH(i,k){if(C.type!='si'||!C.edit||!(i.rop||pq(i.rq)>0))return '';return `<div class="rqb"><label><span>Trả lại</span><input id="rq${k}" inputmode="decimal" placeholder="0" value="${esc(i.rq||'')}" oninput="C.items[${k}].rq=this.value;upT()"><em>${esc(i.unit)}</em></label><small id="rqs${k}">${rqsT(i)}</small></div>`}

C={items:cItems(o),hadD:o.discount>0?1:0,discount:o.discount?String(o.discount):'',note:o.note||'',edit:id,done:null,lock:0,cid:o.cid||'',type:o.type||'le',pm:opm(o),paid:o.paid>0?String(o.paid):'',fromDone:fd0};go('sell')}
