r.cogs=AU?(S.cfg.cogs=='nvl'?r.usePre:r.cogsPre)+r.useA+r.usePost+r.cogsNR:(S.cfg.cogs=='nvl'?r.use:r.cogsP);r.gross=r.rev-r.cogs;r.net=r.gross-r.exp-r.loss;r.cost=r.cogs+r.exp+r.loss;
