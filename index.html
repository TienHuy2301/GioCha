.dh b{display:block}.dh small{display:block;color:var(--m);font-size:12px;font-weight:400}
.dx{border:1px solid var(--b);background:var(--c);color:var(--t);width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:none}
.dg{margin:16px 16px 6px;font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--m)}
.dsec,.drow{display:block;width:calc(100% - 24px);margin:0 12px 8px;background:var(--c);border:1px solid var(--b);border-radius:14px;color:var(--t);text-align:left;padding:0}
.dsec>summary,.drow{display:flex;align-items:center;gap:12px;padding:9px 12px;cursor:pointer;list-style:none;min-height:56px}
.drow{width:calc(100% - 24px)}
.dsec>summary::-webkit-details-marker{display:none}
.dsec>summary>span,.drow>span{flex:1;min-width:0}.dsec b,.drow b{display:block;font-size:15px;font-weight:600}.dsec small,.drow small{display:block;color:var(--m);font-size:12px;font-weight:400}
.dsec>summary>.ico:first-child,.drow>.ico:first-child{width:36px;height:36px;padding:8px;border-radius:11px;background:var(--bar);color:var(--g)}
.chv{width:18px!important;height:18px!important;color:var(--m);transition:transform .2s}.dsec[open]>summary .chv{transform:rotate(90deg)}
.dbody{padding:2px 12px 12px;border-top:1px solid var(--b)}.dbody .card{margin:8px 0 0}.dbody .ghost{margin:6px 0 0}.dbody .sec{margin:8px 0 0}
.lbl{font-size:12px;color:var(--m);margin:10px 2px 4px}
/* tìm kiếm */
#sr{position:fixed;inset:0;z-index:12;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}#sr[hidden]{display:none}
.srh{display:flex;gap:6px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--b)}
.srin{flex:1;display:flex;align-items:center;gap:6px;background:var(--c);border:1px solid var(--b);border-radius:14px;padding:0 4px 0 12px;margin:0;color:var(--m)}
#sri{border:0;background:none;margin:0;min-height:46px;padding:0 4px;outline:0;color:var(--t);font-size:16px}
.srx{border:0;background:var(--b);color:var(--t);width:28px;height:28px;border-radius:50%;font-size:16px;line-height:1;flex:none}
.srcl{border:0;background:none;color:var(--g);font-weight:700;padding:10px 6px}
#srb{flex:1;overflow:auto;padding:6px 12px calc(28px + env(safe-area-inset-bottom,0px));width:100%;max-width:820px;margin:0 auto;overscroll-behavior:contain}
.srm0{text-align:center;color:var(--m);padding:36px 16px}
.srg h4{margin:14px 4px 6px;font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--m);display:flex;justify-content:space-between}
.sri{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--c);border:1px solid var(--b);border-radius:14px;padding:8px 12px;margin-bottom:6px;color:var(--t);min-height:54px}
.sri>.ico{width:34px;height:34px;padding:7px;border-radius:10px;background:var(--bar);color:var(--g)}
.sri .srt{flex:1;min-width:0}.sri b{display:block;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.sri small{display:block;color:var(--m);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.sri em{font-style:normal;font-weight:700;color:var(--g);font-size:13px;white-space:nowrap}
.srmore{color:var(--m);font-size:12px;text-align:center;margin:0 0 6px}
/* lưới / danh sách sản phẩm */
.pgrid{grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.ptile{position:relative;cursor:pointer;padding:6px 6px 8px;text-align:center}
.ptile .pn{max-width:100%;white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:13px;line-height:1.25;font-weight:600}
.ptile small{display:block;font-size:11.5px;line-height:1.25}
.pplus{position:absolute;right:4px;bottom:4px;width:30px;height:30px;border-radius:50%;border:0;background:var(--g2);color:#fff;font-size:20px;line-height:1;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px #0003;padding:0}
.pplus:disabled{display:none}
.pimg{position:relative}
.pgrid .ptile:not(.add) .pimg{width:80%;margin-left:auto;margin-right:auto}
.vt{display:flex;gap:8px;margin:0 0 10px}.vt input{margin:0;flex:1}
.vt .tg{display:flex;border:1px solid var(--b);border-radius:12px;overflow:hidden;flex:none}.vt .tg button{border:0;background:var(--c);color:var(--m);width:44px;display:flex;align-items:center;justify-content:center}.vt .tg button.on{background:var(--g2);color:#fff}
.plist{display:flex;flex-direction:column;gap:6px}
.plist .ptile,.plist .prow{display:flex;flex-direction:row;align-items:center;text-align:left;gap:10px;padding:6px 10px 6px 6px;border-radius:14px;min-height:60px}
.plist .pimg{width:48px;flex:none;margin:0;border-radius:10px}.plist .pplus{position:static;flex:none;margin-left:auto}
.plist .ptile .pn{-webkit-line-clamp:2;text-align:left;font-size:14px}.plist .pt{flex:1;min-width:0}
.plist .ptile.add{min-height:52px;justify-content:center;flex-direction:row;gap:8px}.plist .ptile.add span{font-size:24px}
.plist .badge{position:static;margin-left:4px}
/* màn hình bán hàng gọn */
.chips{grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:6px}
.chip{padding:5px 3px 6px}
.chip .pi{width:40px;height:40px;aspect-ratio:1/1;margin:0 auto 3px;border-radius:10px;object-fit:cover}.chip .ph{font-size:18px}
.chip span{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;text-overflow:clip;text-align:center;line-height:1.2;font-size:12px}
.qk{display:flex;gap:6px;overflow-x:auto;margin-top:6px;padding-bottom:2px;-webkit-overflow-scrolling:touch}
.qk button{flex:none;border:1px solid var(--b);background:var(--bg);color:var(--t);border-radius:999px;padding:5px 11px;font-size:13px;font-weight:600;min-height:30px}
.qk button.on{background:var(--g2);border-color:var(--g2);color:#fff}
@media(min-width:900px){main{max-width:980px}#nv{width:min(460px,calc(100% - 24px))}}

/* ===== p10 ===== */
#nv{width:min(540px,calc(100% - 16px));padding:5px;gap:0}
#nv button{height:56px;gap:2px}
#nv button span{font-size:10px;letter-spacing:-.01em}
@media(max-width:380px){#nv button span{font-size:9.5px}#nv{width:calc(100% - 10px)}}
body.nvmini #nv{width:min(380px,calc(100% - 40px))}
@media(min-width:900px){#nv{width:min(600px,calc(100% - 24px))}#nv button span{font-size:11.5px}}
#hd{padding-left:16px}
#v .dsec,#v .drow{width:100%;margin:0 0 8px}#v .dg{margin:16px 4px 6px}
.pgrid .ptile .pn,.plist .ptile .pn{min-height:0}.pgrid .ptile:not(.add) .pn{min-height:2.5em}
.pgrid .ptile small{min-height:1.25em}
.pgrid .ptile small,.pgrid .ptile small.w{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.ptile .ap{color:var(--g)}.ptile .dm{color:var(--m)!important}
@media(max-width:380px){.pgrid .ptile small{font-size:11px}}
.ptile.sel{border-color:var(--g2);box-shadow:0 0 0 2px var(--g2) inset;background:var(--bar)}
.ptile.sel .pplus{font-size:0}.ptile.sel .pplus::after{content:'✓';font-size:16px}
.plist .ptile.sel .pimg{background:var(--c)}
</style></head><body>
<header id="hd">Giò chả</header>
<main id="v"></main>
<div id="sr" hidden role="dialog" aria-label="Tìm kiếm"><div class="srh"><label class="srin"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input id="sri" type="text" inputmode="search" enterkeyhint="search" placeholder="Tìm sản phẩm, khách hàng, đơn hàng…" autocomplete="off" autocapitalize="off" spellcheck="false" oninput="srIn()"><button id="src" class="srx" onclick="srClear()" aria-label="Xóa nội dung" hidden>×</button></label><button class="srcl" onclick="closeSr()">Đóng</button></div><div id="srb"></div></div>
<div id="bar" hidden></div><nav id="nv"></nav>
<div id="au" class="modal" style="align-items:flex-start;overflow:auto;background:var(--bg)"><div class="mb" id="ab" style="margin-top:8vh"></div></div>
<div id="m" class="modal" hidden></div><div id="toast"></div>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script>
const $=s=>document.querySelector(s),V=7*36e5;let K='giocha_v1';
let S=null;try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
if(!S||!S.orders)S={products:[],orders:[],units:['kg','cây','đòn','hộp','phần'],shop:'Cơ sở giò chả',seq:0,pseq:0};
const DEF={showCust:1,showDisc:1,showNote:1,showImg:1,showProfit:1,showType:1};
function norm(){['customers','suppliers','imports'].forEach(c=>S[c]=S[c]||[]);S.cfg=Object.assign({},DEF,S.cfg)}norm();
let DB=null,ADM=true,CA={},SYN='Đang kết nối…',busy=0,again=0;
const COLS=['products','orders','customers','suppliers','imports'],W=c=>ADM||c=='orders'||c=='customers';
const sj=o=>JSON.stringify(o,(k,v)=>v&&typeof v=='object'&&!Array.isArray(v)?Object.keys(v).sort().reduce((a,b)=>(a[b]=v[b],a),{}):v);
const sy=m=>{SYN=m;document.querySelectorAll('#sy,.sy2').forEach(e=>e.textContent=m)};
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}push()};
async function push(){if(!DB)return;if(busy){again=1;return}busy=1;try{sy('Đang đồng bộ…');
for(const c of COLS){if(!W(c))continue;for(const x of S[c]){const j=sj(x),k=c+'/'+x.id;if(CA[k]!==j){await DB.doc(k).set(x);CA[k]=j}}}
for(const k of Object.keys(CA)){if(k=='cfg')continue;const[c,id]=k.split('/');if(W(c)&&!S[c].some(x=>x.id==id)){await DB.doc(k).delete();delete CA[k]}}
if(ADM){const cf={shop:S.shop,units:S.units,cfg:S.cfg},j=sj(cf);if(CA.cfg!==j){await DB.doc('settings/main').set(cf);CA.cfg=j}}
sy('Đã đồng bộ ✓')}catch(e){if(e&&e.code=='invalid_argument')sy('Không có quyền ghi');else{sy('Mất mạng/lỗi — tự thử lại');setTimeout(push,6000)}}busy=0;if(again){again=0;push()}}
function refresh(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}if(!$('#sr').hidden){srRun();return}const a=document.activeElement;if(PF||FM.cus||FM.sup||IF||(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)))return;if(!$('#m').hidden)return;if(tab=='sell'&&!C.done){const g=sj(S.products)+sj(S.customers);if(g==SG)return;SG=g}R()}
let SB=null,PROF=null,entered=0,REC=0,lt=0;
const TBL='records',chk=r=>{if(r.error)throw{code:(r.error.code=='42501'||r.status==403)?'invalid_argument':'net',message:r.error.message}};
function mkDB(){return{doc:p=>{const i=p.indexOf('/'),st=p.slice(0,i),id=p.slice(i+1);return{
set:async x=>chk(await SB.from(TBL).upsert({shop_id:PROF.shop_id,store:st,id,data:x},{onConflict:'shop_id,store,id'})),
delete:async()=>chk(await SB.from(TBL).delete().eq('shop_id',PROF.shop_id).eq('store',st).eq('id',id))}}}}
function apply(c,rem){const dirty=W(c)?S[c].filter(x=>CA[c+'/'+x.id]!==sj(x)):[];rem.forEach(x=>{if(!dirty.some(d=>d.id==x.id))CA[c+'/'+x.id]=sj(x)});
Object.keys(CA).filter(k=>k.startsWith(c+'/')&&!rem.some(x=>c+'/'+x.id==k)).forEach(k=>delete CA[k]);S[c]=[...rem.filter(x=>!dirty.some(d=>d.id==x.id)),...dirty]}
async function loadAll(){if(!SB||!PROF)return;let rows=[],from=0;try{for(;;){const r=await SB.from(TBL).select('store,id,data').eq('shop_id',PROF.shop_id).order('store').order('id').range(from,from+999);if(r.error)throw r.error;rows=rows.concat(r.data);if(r.data.length<1000)break;from+=1000}}catch(e){return sy('Mất mạng — đang dùng dữ liệu trên máy')}
COLS.forEach(c=>apply(c,rows.filter(x=>x.store==c).map(x=>x.data)));
const st=rows.find(x=>x.store=='settings'&&x.id=='main');if(st){const d=st.data;S.shop=d.shop||S.shop;S.units=d.units||S.units;S.cfg=Object.assign({},DEF,d.cfg);CA.cfg=sj({shop:S.shop,units:S.units,cfg:S.cfg})}
hd();refresh();if(!busy)sy('Đã đồng bộ ✓')}
const sub=()=>{SB.channel('rec').on('postgres_changes',{event:'*',schema:'public',table:TBL},()=>{clearTimeout(lt);lt=setTimeout(loadAll,400)}).subscribe();setInterval(loadAll,60000);addEventListener('online',()=>{loadAll();push()});document.addEventListener('visibilitychange',()=>{if(!document.hidden)loadAll()})};
function loadLocal(){S=null;try{S=JSON.parse(localStorage.getItem(K))}catch(e){}if(!S||!S.orders)S={products:[],orders:[],units:['kg','cây','đòn','hộp','phần'],shop:(PROF&&PROF.sname)||'Cơ sở giò chả',seq:0,pseq:0};norm();CA={}}
async function enter(se){try{let P=null;try{const r=await SB.from('profiles').select('id,email,role,shop_id').eq('id',se.user.id).single();P=r.data}catch(e){}
if(!P){try{P=JSON.parse(localStorage.getItem('giocha_prof')||'null')}catch(e){}if(!P||P.id!=se.user.id){entered=0;return ashow('login','Không tải được tài khoản. Kiểm tra mạng.')}}
PROF=P;if(!P.shop_id)return ashow('setup');
try{const sh=await SB.from('shops').select('name').eq('id',P.shop_id).single();if(sh.data)P.sname=sh.data.name}catch(e){}
localStorage.setItem('giocha_prof',JSON.stringify(P));ADM=P.role=='admin';K='giocha_'+P.shop_id;loadLocal();DB=mkDB();$('#au').hidden=true;hd();R();sy('Đang tải…');await loadAll();sub();push()}catch(e){entered=0;ashow('login','Lỗi: '+(e.message||e))}}
function ashow(m,msg){$('#au').hidden=false;const f=(l,id,t,ac)=>`<label>${l}<input id="${id}" type="${t||'text'}" autocomplete="${ac||'off'}"></label>`;
const M={login:`<h2>🌿 Đăng nhập</h2>${f('Email','a_e','email','username')}${f('Mật khẩu','a_p','password','current-password')}<button class="big" onclick="doLogin()">Đăng nhập</button><button class="ghost" onclick="ashow('reg')">Tạo tài khoản mới</button><button class="ghost" onclick="ashow('forgot')">Quên mật khẩu</button>`,
reg:`<h2>Tạo tài khoản</h2>${f('Email','a_e','email','username')}${f('Mật khẩu (từ 8 ký tự)','a_p','password','new-password')}<button class="big" onclick="doReg()">Đăng ký</button><button class="ghost" onclick="ashow('login')">Đã có tài khoản</button>`,
forgot:`<h2>Quên mật khẩu</h2>${f('Email đã đăng ký','a_e','email','username')}<button class="big" onclick="doForgot()">Gửi email đặt lại mật khẩu</button><button class="ghost" onclick="ashow('login')">Quay lại</button>`,
reset:`<h2>Đặt mật khẩu mới</h2>${f('Mật khẩu mới (từ 8 ký tự)','a_p','password','new-password')}<button class="big" onclick="doReset()">Lưu mật khẩu</button>`,
setup:`<h2>Chọn cơ sở</h2><b>Bạn là chủ cơ sở?</b>${f('Tên cơ sở','a_n')}<button class="big" onclick="mkShop()">Tạo cơ sở mới (làm quản trị viên)</button><hr><b>Bạn là nhân viên?</b>${f('Mã mời do quản trị viên cung cấp','a_c')}<button class="ghost" onclick="joinShop()">Tham gia cơ sở</button><button class="ghost" onclick="SB.auth.signOut()">Đăng xuất</button>`,
cfg:`<h2>Chưa cấu hình</h2><p>Mở tệp <b>config.js</b>, điền Project URL và anon key của Supabase (xem HUONG-DAN.md), rồi tải lại trang.</p>`};
$('#ab').innerHTML=M[m]+`<p id="am" class="mut">${esc(msg||'')}</p>`}
const amsg=t=>{$('#am').textContent=t},em=()=>$('#a_e').value.trim(),pw=()=>$('#a_p').value;
async function doLogin(){const r=await SB.auth.signInWithPassword({email:em(),password:pw()});if(r.error)amsg(/confirm/i.test(r.error.message)?'Hãy bấm liên kết xác nhận trong email trước.':'Sai email hoặc mật khẩu')}
async function doReg(){if(pw().length<8)return amsg('Mật khẩu cần ít nhất 8 ký tự');const r=await SB.auth.signUp({email:em(),password:pw(),options:{emailRedirectTo:location.origin+location.pathname}});if(r.error)return amsg(r.error.message);if(!r.data.session)amsg('Đã gửi email xác nhận. Mở email, bấm liên kết, rồi quay lại đăng nhập.')}
async function doForgot(){const r=await SB.auth.resetPasswordForEmail(em(),{redirectTo:location.origin+location.pathname});amsg(r.error?r.error.message:'Đã gửi email. Mở email và bấm liên kết để đặt mật khẩu mới.')}
async function doReset(){if(pw().length<8)return amsg('Mật khẩu cần ít nhất 8 ký tự');const r=await SB.auth.updateUser({password:pw()});if(r.error)return amsg(r.error.message);location.href=location.pathname}
async function mkShop(){const n=$('#a_n').value.trim();if(!n)return amsg('Nhập tên cơ sở');const r=await SB.rpc('create_shop',{p_name:n});if(r.error)return amsg(r.error.message);location.reload()}
async function joinShop(){const c=$('#a_c').value.trim();if(!c)return amsg('Nhập mã mời');const r=await SB.rpc('join_shop',{p_code:c});if(r.error)return amsg(r.error.message);location.reload()}
function logout(){ask('Đăng xuất khỏi thiết bị này?',async()=>{await SB.auth.signOut();location.reload()})}
function acctH(){return `<div class="card"><small>Tài khoản</small><br><b>${esc(PROF?PROF.email:'')}</b><br><small>${ADM?'Quản trị viên':'Nhân viên'}</small></div>`+`<button class="ghost" onclick="logout()">Đăng xuất</button>`}
function memH(){return `<div class="card" id="mem">Đang tải…</div>`}
async function mem(){if(!ADM||!$('#mem'))return;const[a,b]=await Promise.all([SB.from('shops').select('invite_code').single(),SB.from('profiles').select('id,email,role').eq('shop_id',PROF.shop_id)]);if(!$('#mem'))return;
$('#mem').innerHTML=`<b>Nhân viên</b><p>Mã mời: <b>${esc(a.data?a.data.invite_code:'')}</b> <button class="sm" onclick="regen()">Đổi mã</button><br><small>Nhân viên đăng ký tài khoản, chọn "Tham gia cơ sở" và nhập mã này.</small></p>`+(b.data||[]).map(m=>`<div class="sum"><span>${esc(m.email)}</span><span><select onchange="setRole('${m.id}',this.value)" ${m.id==PROF.id?'disabled':''} style="width:auto"><option value="admin" ${m.role=='admin'?'selected':''}>Quản trị</option><option value="staff" ${m.role=='staff'?'selected':''}>Nhân viên</option></select>${m.id==PROF.id?'':` <button class="sm d" onclick="rmMember('${m.id}')">Xóa</button>`}</span></div>`).join('')}
async function setRole(id,r){const x=await SB.rpc('set_member_role',{p_user:id,p_role:r});toast(x.error?x.error.message:'Đã cập nhật quyền');mem()}
function rmMember(id){ask('Xóa nhân viên này khỏi cơ sở?',async()=>{const x=await SB.rpc('remove_member',{p_user:id});toast(x.error?x.error.message:'Đã xóa');mem()})}

function srRun(){const raw=$('#sri').value.trim();SR.q=raw;const b=$('#srb');SR.res=[];
if(!raw){b.innerHTML='<div class="srm0">Nhập tên sản phẩm, khách hàng, số điện thoại, mã đơn, nhà cung cấp, nguyên liệu hoặc tên mục cài đặt.<br><small>Gõ có dấu hay không dấu đều được.</small></div>';return}
const tk=nz(raw).split(/\s+/).filter(Boolean),hit=s=>{const h=nz(s);return tk.every(t=>h.includes(t))},G=[];
const grp=(t,i,rows)=>{if(rows.length)G.push({t,i,rows})};
grp('Sản phẩm','prods',S.products.filter(p=>hit([p.name,p.code,p.note,p.unit,p.price,p.wprice,p.active?'':'ngung kinh doanh'].join(' '))).map(p=>({t:p.name,s:`${money(p.price)}/${p.unit}${p.wprice>0?' · Sỉ '+money(p.wprice):''}${p.active?'':' · Ngừng KD'}`,m:'',go:()=>{if(ADM){go('prods');ep(p.id)}else{PQ=p.name;go('prods')}}})));
grp('Khách hàng','cus',S.customers.filter(c=>hit([c.name,c.phone,c.addr,c.note,'khach si khach hang'].join(' '))).map(c=>{const[n,t]=stat('cus',c.id);return{t:c.name,s:`${c.phone||'Chưa có số điện thoại'} · ${n}`,m:money(t),go:()=>{go('cus');editD('cus',c.id)}}}));
grp('Đơn hàng','hist',S.orders.filter(o=>hit([o.code,o.cname,o.note,o.type=='si'?'khach si':'khach le',fdt(o.ts),pay(o),...o.items.map(i=>i.name)].join(' '))).sort((a,b)=>b.ts-a.ts).map(o=>({t:o.code+(o.status=='cancelled'?' · Đã hủy':''),s:`${fdt(o.ts)} · ${o.type=='si'?'Khách sỉ':'Khách lẻ'}${o.cname?' · '+o.cname:''} · ${o.items.map(i=>i.name).join(', ')}`,m:money(pay(o)),go:()=>{H.q=o.code;H.m='all';X[o.id]=true;go('hist')}})));
if(ADM){grp('Nhà cung cấp','sup',S.suppliers.filter(c=>hit([c.name,c.phone,c.addr,c.contact,c.note].join(' '))).map(c=>{const[n,t]=stat('sup',c.id);return{t:c.name,s:`${c.phone||'Chưa có số điện thoại'} · ${n}`,m:money(t),go:()=>{go('sup');editD('sup',c.id)}}}));
grp('Nguyên liệu nhập','imp',S.imports.filter(x=>hit([x.name,x.sname,x.note,x.date,x.date.split('-').reverse().join('/')].join(' '))).sort((a,b)=>b.date.localeCompare(a.date)).map(x=>({t:`${x.name} · ${num(x.qty)} ${x.unit}`,s:`${x.sname||'Chưa chọn NCC'} · ${x.date.split('-').reverse().join('/')}`,m:money(iamt(x)),go:()=>{go('imp');editI(x.id)}})))}
grp('Quản lý và cài đặt','sett',SRM().filter(r=>(!r[5]||ADM)&&r[6]!==false&&hit(r[0]+' '+r[1]+' '+r[2])).map(r=>({t:r[0],s:r[1],m:'',ic:r[3],go:r[4]})));
if(!G.length){b.innerHTML=`<div class="srm0">Không có kết quả cho “${esc(raw)}”.<br><small>Thử từ khóa khác, ngắn hơn hoặc không dấu.</small></div>`;return}
const LIM=8;b.innerHTML=G.map(g=>`<div class="srg"><h4><span>${g.t}</span><span>${g.rows.length}</span></h4>${g.rows.slice(0,LIM).map(r=>{SR.res.push(r);return `<button class="sri" onclick="srGo(${SR.res.length-1})">${ic(r.ic||g.i)}<span class="srt"><b>${esc(r.t)}</b><small>${esc(r.s)}</small></span>${r.m?`<em>${esc(r.m)}</em>`:''}</button>`}).join('')}${g.rows.length>LIM?`<p class="srmore">Còn ${g.rows.length-LIM} kết quả nữa — nhập thêm từ khóa để thu hẹp</p>`:''}</div>`).join('')}
function srGo(i){const r=SR.res[i];if(!r)return;closeSr();r.go()}
/* chọn nhanh số lượng kg / lạng */
const QK=[['1 lạng',0.1],['2 lạng',0.2],['3 lạng',0.3],['0,5 kg',0.5],['1 kg',1]];
const qkH=(i,k)=>/^kg$/i.test(i.unit)?`<div class="qk" id="qk${k}">${QK.map(([l,v])=>`<button class="${Math.abs(v-(pq(i.qty)||0))<1e-9?'on':''}" data-v="${v}" onclick="qset(${k},${v})">${l}</button>`).join('')}<button onclick="qfocus(${k})">Khác…</button></div>`:'';
function qhl(k){const i=C.items[k];if(!i)return;const q=pq(i.qty)||0;document.querySelectorAll('#qk'+k+' button[data-v]').forEach(b=>b.classList.toggle('on',Math.abs(+b.dataset.v-q)<1e-9))}
function qset(k,v){const i=C.items[k];if(!i)return;i.qty=String(v).replace('.',',');const e=$('#q'+k);if(e)e.value=i.qty;qhl(k);upT()}
function qfocus(k){const e=$('#q'+k);if(e){e.focus();try{e.select()}catch(x){}}}
/* thêm nhanh vào đơn từ trang sản phẩm */
function addTo(id){const p=S.products.find(x=>x.id==id);if(!p||!p.active)return;if(C.done)C.done=null;go('sell');if(!C.items.some(i=>i.pid==id))add(id);toast('Đã thêm '+p.name+' vào đơn')}
addEventListener('keydown',e=>{if(e.key!=='Escape')return;if(!$('#m').hidden)return closeM();if(!$('#sr').hidden)return closeSr()});
(async()=>{if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
const C=window.CFG||{};if(!C.url||!C.key||!window.supabase)return ashow('cfg');
SB=supabase.createClient(C.url,C.key);
SB.auth.onAuthStateChange((ev,se)=>{if(ev=='PASSWORD_RECOVERY'){REC=1;return ashow('reset')}if(REC)return;if(ev=='SIGNED_OUT'){location.reload();return}if(se&&!entered){entered=1;setTimeout(()=>enter(se),0)}});
const{data}=await SB.auth.getSession();if(!data.session&&!REC)ashow('login')})();
</script></body></html>
